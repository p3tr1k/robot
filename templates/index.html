<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        button {
            font-size: 20px;
            padding: 15px;
            margin: 10px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        button:active {
            background-color: #ccc;
        }
    </style>
    <script>
        let activeButton = null;

        function sendCommand(action) {
            fetch(`/command/${action}`, { method: 'POST' })
                .catch(error => console.error('Error:', error));
        }

        function startAction(action) {
            activeButton = setInterval(() => sendCommand(action), 50);
        }

        function stopAction() {
            if (activeButton) {
                clearInterval(activeButton);
                activeButton = null;
                sendCommand('stop');
            }
        }

        function releaseServos() {
            fetch('/release_servos', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log(data.message);
                    alert(data.message);
                })
                .catch(error => {
                    console.error('Chyba:', error);
                    alert('Chyba pri uvoľnení servomotorov.');
                });
        }
    </script>
</head>
<body>
    <h1>Robot Control</h1>

    <h2>Video Stream</h2>
    <img src="/video_feed" width="640" height="480" alt="Video Feed" />

    <h2>Motors</h2>
    <button onmousedown="startAction('forward')" onmouseup="stopAction()" ontouchstart="startAction('forward')" ontouchend="stopAction()">Forward</button>
    <br>
    <button onmousedown="startAction('left')" onmouseup="stopAction()" ontouchstart="startAction('left')" ontouchend="stopAction()">Left</button>
    <button onmousedown="startAction('right')" onmouseup="stopAction()" ontouchstart="startAction('right')" ontouchend="stopAction()">Right</button>
    <br>
    <button onmousedown="startAction('backward')" onmouseup="stopAction()" ontouchstart="startAction('backward')" ontouchend="stopAction()">Backward</button>

    <h2>Arm</h2>
    <button onmousedown="startAction('rotate_left')" onmouseup="stopAction()" ontouchstart="startAction('rotate_left')" ontouchend="stopAction()">Rotate Left</button>
    <button onmousedown="startAction('rotate_right')" onmouseup="stopAction()" ontouchstart="startAction('rotate_right')" ontouchend="stopAction()">Rotate Right</button>
    <br>
    <button onmousedown="startAction('arm_up')" onmouseup="stopAction()" ontouchstart="startAction('arm_up')" ontouchend="stopAction()">Arm Up</button>
    <button onmousedown="startAction('arm_down')" onmouseup="stopAction()" ontouchstart="startAction('arm_down')" ontouchend="stopAction()">Arm Down</button>
    <br>
    <button onmousedown="startAction('grip_close')" onmouseup="stopAction()" ontouchstart="startAction('grip_close')" ontouchend="stopAction()">Grip Close</button>
    <button onmousedown="startAction('grip_open')" onmouseup="stopAction()" ontouchstart="startAction('grip_open')" ontouchend="stopAction()">Grip Open</button>
    <br>
    <button onclick="releaseServos()">Release Servos</button>

    <h2>Camera</h2>
    <button onmousedown="startAction('cam_up')" onmouseup="stopAction()" ontouchstart="startAction('cam_up')" ontouchend="stopAction()">Camera Up</button>
    <button onmousedown="startAction('cam_down')" onmouseup="stopAction()" ontouchstart="startAction('cam_down')" ontouchend="stopAction()">Camera Down</button>
    <br>
    <button onmousedown="startAction('cam_left')" onmouseup="stopAction()" ontouchstart="startAction('cam_left')" ontouchend="stopAction()">Camera Left</button>
    <button onmousedown="startAction('cam_right')" onmouseup="stopAction()" ontouchstart="startAction('cam_right')" ontouchend="stopAction()">Camera Right</button>
</body>
</html>
