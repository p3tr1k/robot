<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        button {
            font-size: 20px;
            padding: 15px;
            margin: 10px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        button:active {
            background-color: #ccc;
        }
    </style>
    <script>
        let activeButton = null;

        function sendCommand(action) {
            fetch(`/command/${action}`, { method: 'POST' })
                .catch(error => console.error('Error:', error));
        }

        function startAction(action, event) {
            if (event && event.cancelable) event.preventDefault(); // Zabraňuje zdvojeniu touch/mouse eventov
            if (activeButton) {
                clearInterval(activeButton);
            }
            // Pošleme príkaz okamžite a potom opakujeme
            sendCommand(action);
            activeButton = setInterval(() => sendCommand(action), 50);
        }

        function stopAction(event) {
            if (event && event.cancelable) event.preventDefault();
            if (activeButton) {
                clearInterval(activeButton);
                activeButton = null;
            }
            sendCommand('stop');
        }

        function releaseServos() {
            fetch('/release_servos', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    console.log(data.message);
                    alert(data.message);
                })
                .catch(error => {
                    console.error('Chyba:', error);
                    alert('Chyba pri uvoľnení servomotorov.');
                });
        }
    </script>
</head>
<body>
    <h1>Robot Control</h1>

    <h2>Video Stream</h2>
    <img src="/video_feed" width="640" height="480" alt="Video Feed" />

    <h2>Motors</h2>
    <button onmousedown="startAction('forward', event)" onmouseup="stopAction(event)" ontouchstart="startAction('forward', event)" ontouchend="stopAction(event)">Forward</button>
    <br>
    <button onmousedown="startAction('left', event)" onmouseup="stopAction(event)" ontouchstart="startAction('left', event)" ontouchend="stopAction(event)">Left</button>
    <button onmousedown="startAction('right', event)" onmouseup="stopAction(event)" ontouchstart="startAction('right', event)" ontouchend="stopAction(event)">Right</button>
    <br>
    <button onmousedown="startAction('backward', event)" onmouseup="stopAction(event)" ontouchstart="startAction('backward', event)" ontouchend="stopAction(event)">Backward</button>

    <h2>Arm</h2>
    <button onmousedown="startAction('rotate_left', event)" onmouseup="stopAction(event)" ontouchstart="startAction('rotate_left', event)" ontouchend="stopAction(event)">Rotate Left</button>
    <button onmousedown="startAction('rotate_right', event)" onmouseup="stopAction(event)" ontouchstart="startAction('rotate_right', event)" ontouchend="stopAction(event)">Rotate Right</button>
    <br>
    <button onmousedown="startAction('arm_up', event)" onmouseup="stopAction(event)" ontouchstart="startAction('arm_up', event)" ontouchend="stopAction(event)">Arm Up</button>
    <button onmousedown="startAction('arm_down', event)" onmouseup="stopAction(event)" ontouchstart="startAction('arm_down', event)" ontouchend="stopAction(event)">Arm Down</button>
    <br>
    <button onmousedown="startAction('elbow_up', event)" onmouseup="stopAction(event)" ontouchstart="startAction('elbow_up', event)" ontouchend="stopAction(event)">Elbow Up</button>
    <button onmousedown="startAction('elbow_down', event)" onmouseup="stopAction(event)" ontouchstart="startAction('elbow_down', event)" ontouchend="stopAction(event)">Elbow Down</button>
    <br>
    <button onmousedown="startAction('wrist_up', event)" onmouseup="stopAction(event)" ontouchstart="startAction('wrist_up', event)" ontouchend="stopAction(event)">Wrist Up</button>
    <button onmousedown="startAction('wrist_down', event)" onmouseup="stopAction(event)" ontouchstart="startAction('wrist_down', event)" ontouchend="stopAction(event)">Wrist Down</button>
    <br>
    <button onmousedown="startAction('grip_close', event)" onmouseup="stopAction(event)" ontouchstart="startAction('grip_close', event)" ontouchend="stopAction(event)">Grip Close</button>
    <button onmousedown="startAction('grip_open', event)" onmouseup="stopAction(event)" ontouchstart="startAction('grip_open', event)" ontouchend="stopAction(event)">Grip Open</button>
    <br>
    <button onclick="releaseServos()">Release Servos</button>

    <h2>Camera</h2>
    <button onmousedown="startAction('cam_up', event)" onmouseup="stopAction(event)" ontouchstart="startAction('cam_up', event)" ontouchend="stopAction(event)">Camera Up</button>
    <button onmousedown="startAction('cam_down', event)" onmouseup="stopAction(event)" ontouchstart="startAction('cam_down', event)" ontouchend="stopAction(event)">Camera Down</button>
    <br>
    <button onmousedown="startAction('cam_left', event)" onmouseup="stopAction(event)" ontouchstart="startAction('cam_left', event)" ontouchend="stopAction(event)">Camera Left</button>
    <button onmousedown="startAction('cam_right', event)" onmouseup="stopAction(event)" ontouchstart="startAction('cam_right', event)" ontouchend="stopAction(event)">Camera Right</button>
</body>
</html>
