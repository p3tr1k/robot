<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <!-- Uzamknutie škálovania a fixácia na mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Robot Ovládač</title>
    <!-- Moderný font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100dvh; /* 100dvh rešpektuje UI mobilného prehliadača */
            overflow: hidden; /* Zákaz scrollovania */
            background-color: #0c0c0c;
            font-family: 'Inter', sans-serif;
            color: #fff;
            /* Ak zariadenie podporuje safe-areas (napr. iPhone Notch), využi ich */
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Stream z kamery na pozadí */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            /* Použijeme contain, aby kamera nebola orezaná, okraje budú čierne a prekryté sklom */
            object-fit: contain; 
            z-index: 1;
            pointer-events: none;
        }

        /* Hlavný obal pre ovládacie panely */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            pointer-events: none; /* Umožní prejsť klikom mimo panelov (aj keď tu nehrá rolu) */
        }

        .panel {
            pointer-events: auto; /* Znovu povolí klikanie na panely */
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        /* Ľavá strana (D-Pads) */
        .left-panel {
            align-items: center;
            gap: 20px;
            margin-bottom: 100px; /* Posunutie celej ľavej časti nahor */
        }

        /* D-Pad Štýl */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 52px); /* Zmenšené o 20% (z 65px) */
            grid-template-rows: repeat(3, 52px);
            gap: 5px;
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .d-pad.small {
            grid-template-columns: repeat(3, 35px); /* Zmenšené proporcionálne */
            grid-template-rows: repeat(3, 35px);
            padding: 8px;
            margin-bottom: -8px;
        }

        .d-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            color: white;
            font-size: 20px; /* Zmenšené z 24px */
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.05s ease-out;
            cursor: pointer;
        }

        .d-pad.small .d-btn {
            font-size: 16px;
            border-radius: 8px;
        }

        .d-btn:active, .d-btn.active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.92);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Pozície v kríži */
        .d-pad .up { grid-column: 2; grid-row: 1; }
        .d-pad .left { grid-column: 1; grid-row: 2; }
        .d-pad .right { grid-column: 3; grid-row: 2; }
        .d-pad .down { grid-column: 2; grid-row: 3; }

        /* Popisky D-Padov */
        .pad-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Pravá strana (Rameno) */
        .right-panel {
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px 18px; /* Rozšírené o ca 16px */
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 98dvh;
            overflow-y: auto; /* Ak by bol displej primalý */
            /* Zrušený scale pre návrat k 100% veľkosti */
        }

        .arm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 15px; /* Väčšie medzery do šírky (pridá cca 10px) */
            align-items: center;
        }

        .arm-row-title {
            grid-column: span 2;
            color: rgba(255,255,255,0.5);
            font-size: 9px; /* Zmenšený font nadpisov */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: -2px;
            margin-top: 2px;
            text-align: center;
            font-weight: 600;
        }

        .arm-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            color: white;
            padding: 10px 25px; /* Výrazne širšie tlačidlá (pridá cca 40px každému) */
            font-size: 20px; /* Zväčšené emoji pre lepší klik */
            font-weight: 600;
            transition: all 0.05s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.05), 0 2px 4px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .arm-btn:active, .arm-btn.active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.95);
        }

        /* Tlačidlá vrch (Park, Uvoľniť) */
        .release-btn {
            background: rgba(255, 40, 40, 0.2);
            color: #ff5555;
            border: 1px solid rgba(255, 40, 40, 0.4);
            padding: 10px 10px; /* Širšie */
            border-radius: 10px;
            font-size: 20px; /* Zväčšené Emoji */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255,0,0,0.1);
            transition: all 0.2s;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .release-btn:active {
            background: rgba(255, 40, 40, 0.8);
            color: white;
            transform: scale(0.95);
        }

        /* Skrytie posuvníkov */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Video na pozadí -->
    <img src="/video_feed" class="video-background" alt="Video Stream" />



    <!-- Overlay s ovládacími prvkami -->
    <div class="ui-overlay">
        
        <!-- Ľavý palec: Pohyb a Kamera -->
        <div class="panel left-panel">
            
            <!-- Kamera D-Pad -->
            <div class="d-pad small">
                <div class="pad-label">Kamera</div>
                <button class="d-btn up action-btn" data-action="cam_up">▲</button>
                <button class="d-btn left action-btn" data-action="cam_left">◀</button>
                <button class="d-btn action-btn" data-action="cam_center" style="grid-column: 2; grid-row: 2; font-size: 14px; border-radius: 50%;">◉</button>
                <button class="d-btn right action-btn" data-action="cam_right">▶</button>
                <button class="d-btn down action-btn" data-action="cam_down">▼</button>
            </div>
            
            <!-- Podvozok D-Pad -->
            <div class="d-pad">
                <div class="pad-label">Jazda</div>
                <button class="d-btn up action-btn" data-action="forward">W</button>
                <button class="d-btn left action-btn" data-action="left">A</button>
                <button class="d-btn right action-btn" data-action="right">D</button>
                <button class="d-btn down action-btn" data-action="backward">S</button>
            </div>
        </div>

        <!-- Pravý palec: Rameno -->
        <div class="panel right-panel">
            <div style="display: flex; gap: 15px; margin-bottom: 12px;">
                <button class="release-btn park-btn" onclick="parkArm()" style="background: rgba(40, 150, 255, 0.2); color: #55aaff; border-color: rgba(40, 150, 255, 0.4);" title="Parkovať">🅿️</button>
                <button class="release-btn" onclick="releaseServos()" title="Uvoľniť">⚠️</button>
            </div>
            <div class="arm-grid">
                
                <div class="arm-row-title">Základňa (Base)</div>
                <button class="arm-btn action-btn" data-action="rotate_left">⬅️</button>
                <button class="arm-btn action-btn" data-action="rotate_right">➡️</button>

                <div class="arm-row-title">Rameno (Shoulder)</div>
                <button class="arm-btn action-btn" data-action="arm_up">⬆️</button>
                <button class="arm-btn action-btn" data-action="arm_down">⬇️</button>

                <div class="arm-row-title">Lakeť (Elbow)</div>
                <button class="arm-btn action-btn" data-action="elbow_up">⬆️</button>
                <button class="arm-btn action-btn" data-action="elbow_down">⬇️</button>

                <div class="arm-row-title">Zápästie (Wrist)</div>
                <button class="arm-btn action-btn" data-action="wrist_up">⬆️</button>
                <button class="arm-btn action-btn" data-action="wrist_down">⬇️</button>

                <div class="arm-row-title">Klepeto (Grip)</div>
                <button class="arm-btn action-btn" data-action="grip_open">🔓</button>
                <button class="arm-btn action-btn" data-action="grip_close">🔒</button>

            </div>
        </div>

    </div>

    <!-- JavaScript Logika -->
    <script>
        let activeAction = null;
        let isFetching = false;

        function sendCommand(action) {
            return fetch(`/command/${action}`, { method: 'POST' })
                .catch(error => console.error('API Error:', error));
        }

        async function actionLoop() {
            if (!activeAction || isFetching) return;
            isFetching = true;
            await sendCommand(activeAction);
            isFetching = false;
            
            // Loop while action is active
            if (activeAction) {
                setTimeout(actionLoop, 20);
            }
        }

        function startAction(action, btnElement, event) {
            if (event && event.cancelable) event.preventDefault(); 
            btnElement.classList.add('active'); // Vizuálny feedback
            if (activeAction !== action) {
                activeAction = action;
                actionLoop();
            }
        }

        function stopAction(btnElement, event) {
            if (event && event.cancelable) event.preventDefault();
            btnElement.classList.remove('active');
            if (activeAction) {
                activeAction = null;
                sendCommand('stop');
            }
        }

        // Hromadné priradenie eventov (aby sa eliminovali duplicity touch/mouse)
        document.querySelectorAll('.action-btn').forEach(btn => {
            const action = btn.dataset.action;
            
            // Start
            btn.addEventListener('mousedown', (e) => startAction(action, btn, e));
            btn.addEventListener('touchstart', (e) => startAction(action, btn, e));
            
            // Stop
            btn.addEventListener('mouseup', (e) => stopAction(btn, e));
            btn.addEventListener('mouseleave', (e) => stopAction(btn, e));
            btn.addEventListener('touchend', (e) => stopAction(btn, e));
            btn.addEventListener('touchcancel', (e) => stopAction(btn, e));
            
            // Blokovanie menu pri dlhom podržaní na mobile
            btn.addEventListener('contextmenu', e => e.preventDefault());
        });

        // Samostatná funkcia pre parkovanie
        function parkArm() {
            const btn = document.querySelector('.park-btn');
            const originalText = btn.innerText;
            btn.innerText = "⏳";
            
            fetch('/command/park_arm', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    btn.innerText = "✅";
                    setTimeout(() => btn.innerText = originalText, 1500);
                })
                .catch(error => {
                    console.error('Chyba:', error);
                    btn.innerText = "❌";
                    setTimeout(() => btn.innerText = originalText, 1500);
                });
        }

        // Samostatná funkcia pre uvoľnenie serv
        function releaseServos() {
            const btn = document.querySelectorAll('.release-btn')[1]; // Druhé tlačidlo v poradí
            const originalText = btn.innerText;
            btn.innerText = "⏳";
            
            fetch('/release_servos', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    btn.innerText = "✅";
                    setTimeout(() => btn.innerText = originalText, 1500);
                })
                .catch(error => {
                    console.error('Chyba:', error);
                    btn.innerText = "❌";
                    setTimeout(() => btn.innerText = originalText, 1500);
                });
        }
    </script>
</body>
</html>
